name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9 has no build for Ubuntu 26.04, but RHEL 9 still ships it as the
    # system Python, so that job stays on 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e '.[dev]'
      - name: lint
        run: ruff check .
      - name: test
        run: pytest -q
