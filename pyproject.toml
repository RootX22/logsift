[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logsift"
version = "0.1.0"
description = "Streaming log filter that collapses noise into patterns and surfaces the rare lines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "logsift contributors" }]
keywords = ["logs", "devops", "grep", "observability", "streaming"]

[project.scripts]
logsift = "logsift.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["logsift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
